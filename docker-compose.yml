services:
  postgres:
    image: postgres:16-alpine
    container_name: tecnouam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tecnouam}
      POSTGRES_USER: ${POSTGRES_USER:-tecnouam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tecnouam_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tecnouam-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tecnouam-postgres-data:

